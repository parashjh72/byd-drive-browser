name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); AGP fetches any missing platform.
      - run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk DriveBrowser.apk
      - uses: actions/upload-artifact@v4
        with: { name: DriveBrowser-apk, path: DriveBrowser.apk }
      # Also publish the APK to the "apk" branch so it can be fetched with plain git.
      - name: Publish APK to apk branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp DriveBrowser.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add DriveBrowser.apk && git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
