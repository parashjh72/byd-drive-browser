name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); AGP fetches any missing platform.
      - run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk DriveBrowser.apk
      - uses: actions/upload-artifact@v4
        with: { name: DriveBrowser-apk, path: DriveBrowser.apk }
