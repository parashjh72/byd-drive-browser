plugins { id 'com.android.application' }
android {
    namespace 'com.bydbrowser.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.bydbrowser.app"
        minSdk 24          // BYD DiLink 3.0+ runs Android 9-12
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    buildTypes {
        release {
            minifyEnabled true          // R8: strips unused code -> tiny APK
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug   // installable without a keystore
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
